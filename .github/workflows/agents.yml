# Hand-written, listed in .actlith: only the new-agent watch runs here.
# The agent-input PR comes from the owner's tending loop (owner
# 2026-10-24), which actlith v0.1.0's `update-pins` kind cannot express.
---
name: agents

on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:

concurrency:
  group: agents
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A new agent upstream opens one issue, never a red build (nix/agents V5).
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      - run: nix develop ./dev --command bash scripts/ci/agents-watch.sh x86_64-linux
        env:
          GH_TOKEN: ${{ github.token }}
